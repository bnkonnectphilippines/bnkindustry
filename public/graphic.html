<!doctype html>

  <link rel="stylesheet" href="styles.css">
  <style>
    .graphic-cards{align-items:stretch;grid-template-columns:repeat(4,minmax(0,1fr))}
    .graphic-card{display:flex;flex-direction:column;min-height:430px;overflow:hidden}
    .graphic-card .photo-card{height:170px;flex:0 0 170px;margin:-1px -1px 18px;background:linear-gradient(180deg,rgba(7,16,31,0) 58%,rgba(7,16,31,.88)),#251b58 center/cover no-repeat;border-radius:18px 18px 10px 10px}
    .graphic-card .card-content{display:flex;flex:1;flex-direction:column;padding:0 4px 4px}
    .graphic-card h3{font-size:clamp(.78rem,1.2vw,.98rem);line-height:1.25;min-height:48px;margin:0 0 10px;letter-spacing:.015em}
    .graphic-card .mini-label{font-size:.78rem;letter-spacing:.08em;white-space:nowrap;color:var(--muted);margin-bottom:8px}
    .graphic-card .price{font-size:1.35rem;line-height:1.2;margin:0 0 18px;color:var(--mint);font-weight:800}
    .graphic-card .btn{margin-top:auto;width:100%;text-align:center}
    @media(max-width:1050px){.graphic-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.graphic-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.graphic-card{min-height:390px}.graphic-card .photo-card{height:140px;flex-basis:140px}.graphic-card h3{font-size:.72rem;min-height:54px}.graphic-card .mini-label{font-size:.66rem}.graphic-card .price{font-size:1.05rem}}
    @media(max-width:430px){.graphic-cards{grid-template-columns:1fr}.graphic-card{min-height:410px}.graphic-card .photo-card{height:180px;flex-basis:180px}.graphic-card h3{font-size:.84rem;min-height:auto}}
  </style>
</head>
